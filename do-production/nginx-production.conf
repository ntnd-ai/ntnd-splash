map $uri $ntnd_frame_policy {
    default SAMEORIGIN;
    ~^/(contact|apply|verify-email|unsubscribe)\.html$ DENY;
}
map $host $ntnd_robots {
    default "noindex, nofollow";
    ntnd.ai "";
    www.ntnd.ai "";
}
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    client_max_body_size 1k;
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options $ntnd_frame_policy always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag $ntnd_robots always;
    add_header Cache-Control "no-store" always;
    if ($host = www.ntnd.ai) { return 301 https://ntnd.ai$request_uri; }
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location = /healthz { return 200 "ok\n"; }
    location = /favicon.ico {
        types { }
        default_type image/svg+xml;
        alias /usr/share/nginx/html/assets/favicon.svg;
    }
    location ~ /\. { deny all; }
    location ~ \.mjs$ {
        types { text/javascript mjs; }
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
}
