# Both maps see the URI after try_files: /apply is served as /apply.html, so the
# .html form is what protects it. The optional (\.html)? is a backstop only;
# check-static-host.mjs drives the headers on the short addresses.
map $uri $ntnd_frame_policy {
    default SAMEORIGIN;
    ~^/(contact|apply|verify-email|unsubscribe)(\.html)?$ DENY;
}
# Content-Security-Policy as a response header (frame-ancestors only works in a header).
# Each policy equals the page's own <meta> CSP plus frame-ancestors, so nothing is loosened.
map $uri $ntnd_csp {
    default "default-src 'none'; script-src 'self' https://www.googletagmanager.com; style-src 'self'; img-src 'self' data: https://www.googletagmanager.com https://*.google-analytics.com; font-src 'self'; connect-src 'self' https://www.googletagmanager.com https://*.google-analytics.com https://*.google.com; frame-src 'self'; worker-src 'none'; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests; frame-ancestors 'self'";
    ~^/(contact|apply|verify-email|unsubscribe)(\.html)?$ "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://apply.ntnd.ai; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests; frame-ancestors 'none'";
    ~^/(404|alpha-access|alpha-licence|app-privacy|privacy|terms|community-privacy)(\.html)?$ "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; worker-src 'none'; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests; frame-ancestors 'self'";
    ~^/assets/mockups/ "frame-ancestors 'self'";
}
map $host $ntnd_robots {
    default "noindex, nofollow";
    ntnd.ai "";
    www.ntnd.ai "";
}
server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    # Redirects carry only the path, never nginx's own port (8080).
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    client_max_body_size 1k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options $ntnd_frame_policy always;
    add_header Content-Security-Policy $ntnd_csp always;
    add_header Permissions-Policy "accelerometer=(), browsing-topics=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag $ntnd_robots always;
    add_header Cache-Control "no-store" always;
    if ($host = www.ntnd.ai) { return 301 https://ntnd.ai$request_uri; }
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location = /healthz { return 200 "ok\n"; }
    # One address per page: /apply serves apply.html, and a browser asking for
    # /apply.html is sent to /apply with its query kept (emailed verify and
    # unsubscribe links still work). $request_uri is what the browser sent, so
    # the internal 404 page never redirects.
    location = /index { return 301 /$is_args$args; }
    # The not-found page is only ever shown with a 404 status.
    location = /404 { return 404; }
    location = /404.html { internal; }
    location ~ ^/(?<ntnd_page>[a-z0-9-]+)\.html$ {
        # An unknown .html address is a plain 404, not a redirect to one.
        if (!-f $request_filename) { return 404; }
        if ($request_uri ~ ^/index\.html(\?|$)) { return 301 /$is_args$args; }
        if ($request_uri ~ ^/[a-z0-9-]+\.html(\?|$)) { return 301 /$ntnd_page$is_args$args; }
        try_files $uri =404;
    }
    location = /favicon.ico {
        types { }
        default_type image/x-icon;
        alias /usr/share/nginx/html/assets/favicon.ico;
    }
    location ~ /\. { deny all; }
    location ~ \.mjs$ {
        types { text/javascript mjs; }
        try_files $uri =404;
    }
    location / { try_files $uri $uri.html $uri/ =404; }
    error_page 404 /404.html;
}

# connect.ntnd.ai: hands a platform's sign-in back to ntnd.growth on her Mac (Security C1-C7, N2; 28 Oct 2026).
# Only three things answer on this host, from their own root; nothing of ntnd.ai is served here.
server {
    listen 8080;
    server_name connect.ntnd.ai;
    server_tokens off;
    absolute_redirect off;
    root /usr/share/nginx/connect;
    access_log off;
    client_max_body_size 1k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "accelerometer=(), browsing-topics=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=()" always;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location = /connect.js { try_files /connect.js =404; }
    location = /connect.css { try_files /connect.css =404; }
    location ~ ^/(linkedin|instagram|facebook|threads|pinterest|tiktok)$ { try_files /index.html =404; }
    location / { return 404; }
}
