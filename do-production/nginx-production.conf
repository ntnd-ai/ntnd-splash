map $uri $ntnd_frame_policy {
    default SAMEORIGIN;
    ~^/(contact|apply|verify-email|unsubscribe)\.html$ DENY;
}
# Content-Security-Policy as a response header (frame-ancestors only works in a header).
# Each policy equals the page's own <meta> CSP plus frame-ancestors, so nothing is loosened.
map $uri $ntnd_csp {
    default "default-src 'none'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.googletagmanager.com https://*.google-analytics.com; font-src 'self'; connect-src 'self' https://www.googletagmanager.com https://*.google-analytics.com https://*.google.com; frame-src 'self'; worker-src 'none'; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests; frame-ancestors 'self'";
    ~^/(contact|apply|verify-email|unsubscribe)\.html$ "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://apply.ntnd.ai; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests; frame-ancestors 'none'";
    ~^/(404|alpha-access|alpha-licence|app-privacy|privacy|terms|community-privacy)\.html$ "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; worker-src 'none'; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests; frame-ancestors 'self'";
    ~^/assets/mockups/ "frame-ancestors 'self'";
}
map $host $ntnd_robots {
    default "noindex, nofollow";
    ntnd.ai "";
    www.ntnd.ai "";
}
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    client_max_body_size 1k;
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options $ntnd_frame_policy always;
    add_header Content-Security-Policy $ntnd_csp always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag $ntnd_robots always;
    add_header Cache-Control "no-store" always;
    if ($host = www.ntnd.ai) { return 301 https://ntnd.ai$request_uri; }
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location = /healthz { return 200 "ok\n"; }
    # Packaged Mac alpha builds link to the extensionless approved terms URL.
    location = /terms { rewrite ^/terms$ /terms.html last; }
    location = /favicon.ico {
        types { }
        default_type image/svg+xml;
        alias /usr/share/nginx/html/assets/favicon.svg;
    }
    location ~ /\. { deny all; }
    location ~ \.mjs$ {
        types { text/javascript mjs; }
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
}
